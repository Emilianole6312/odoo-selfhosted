# /opt/odoo-server/docker-compose.yml
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odoo-net

  odoo:
    image: odoo:17
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./volumes/odoo/addons:/mnt/extra-addons
      - ./volumes/odoo/data:/var/lib/odoo
    ports:
      - "8069:8069"
    networks:
      - odoo-net

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - odoo
    volumes:
      - ./nginx/odoo.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - odoo-net

networks:
  odoo-net:
