# Configuración de Backups
# Ubicación: infra/backup.conf

# Base de datos
BACKUP_DB_NAME="odoo"
BACKUP_DB_USER="odoo"

# Ruta base
BACKUP_BASE="${BACKUP_BASE:-/opt/odoo-server}"

# Rutas 
BACKUP_DIR="${BACKUP_BASE}/infra/volumes/backups"
FILESTORE_PATH="${BACKUP_BASE}/infra/volumes/odoo/data"
DOCKER_COMPOSE_DIR="${BACKUP_BASE}/infra"
LOG_FILE="${BACKUP_BASE}/infra/logs/backup.log"

# Retención (días)
RETENTION_DIARIO=3
RETENTION_SEMANAL=28

# Logs
LOG_FILE="${BACKUP_BASE}/infra/logs/backup.log"
